name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build (sem avisos)
        run: dotnet build NovaisBoost.slnx -c Release -warnaserror
      - name: Testes
        run: dotnet test NovaisBoost.slnx -c Release --no-build --logger "trx;LogFileName=results.trx"
      - name: Resultados dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"
